<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Offline by design: block every network connection, remote image and web font. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; font-src 'none'; img-src data: blob:; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Grade Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5fd0'/%3E%3Cpath d='M6 18V11M11 18V6M16 18v-5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/students.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <noscript><p style="padding:20px">Grade Tracker needs JavaScript. Enable it for this page (the app never goes online).</p></noscript>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 18V11M11 18V6M16 18v-5"/></svg></span>Grade Tracker</div>
      <div class="course-picker">
        <label for="course-select" class="sr-only">Course</label>
        <select id="course-select" title="Switch course"></select>
        <button id="btn-course-menu" class="btn btn-icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Course actions" title="Course actions: add, edit, duplicate, sample data, delete"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button id="btn-undo" class="btn btn-icon btn-ghost" type="button" aria-label="Undo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button id="btn-redo" class="btn btn-icon btn-ghost" type="button" aria-label="Redo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        <button id="backup-chip" class="btn btn-sm btn-ghost" type="button">Backup</button>
        <button id="btn-data-menu" class="btn btn-sm" type="button" aria-haspopup="menu" aria-expanded="false">Data <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="btn-privacy" class="btn btn-sm" type="button" aria-pressed="false">Privacy</button>
        <button id="btn-theme" class="btn btn-icon btn-ghost" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Theme"></button>
      </div>
    </header>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
    <div id="banners" class="banners"></div>
    <main id="view" class="view" tabindex="-1" role="tabpanel"></main>
    <footer id="statusbar" class="statusbar"></footer>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Core logic (pure, also unit-tested in Node) -->
  <script src="js/core/util.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/calc.js"></script>
  <script src="js/core/history.js"></script>
  <script src="js/core/sample.js"></script>
  <script src="js/core/csv.js"></script>
  <!-- App state and storage -->
  <script src="js/storage.js"></script>
  <script src="js/store.js"></script>
  <!-- UI -->
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/grid.js"></script>
  <script src="js/ui/students.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/history-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
